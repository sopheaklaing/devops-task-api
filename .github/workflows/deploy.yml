name: Deploy Production

on:
  workflow_run:
    workflows: ["Laravel CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Login to GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Pull production image
      - name: Pull production image
        shell: powershell
        run: |
          docker pull ghcr.io/sopheaklaing/devops-task-api:1.0.0

      # 4. Deploy production
      - name: Deploy production
        shell: powershell
        run: |
          docker compose -f compose.prod.yaml up -d

      # 5. Verify production containers
      - name: Verify production containers
        shell: powershell
        run: |
          docker compose -f compose.prod.yaml ps

      # 6. Health check
      - name: Health check
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:8002" `
            -UseBasicParsing

          Write-Host "Laravel HTTP Status: $($response.StatusCode)"

          if ($response.StatusCode -ne 200) {
              Write-Error "Production health check failed."
              exit 1
          }

          Write-Host "Production health check passed."

      # 7. Logout from GHCR
      - name: Logout from GHCR
        shell: powershell
        run: |
          docker logout ghcr.io