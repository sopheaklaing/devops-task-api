name: Deploy Production

on:
  workflow_run:
    workflows: ["Laravel CI"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull production image
        shell: powershell
        run: |
          docker pull ghcr.io/sopheaklaing/devops-task-api:1.0.0

      - name: Deploy production
        shell: powershell
        run: |
          docker compose -f compose.prod.yaml up -d

      - name: Check production containers
        shell: powershell
        run: |
          docker compose -f compose.prod.yaml ps

      - name: Check Laravel application
        shell: powershell
        run: |
          $response = Invoke-WebRequest `
            -Uri "http://localhost:8002/task" `
            -UseBasicParsing

          Write-Host "Laravel HTTP Status: $($response.StatusCode)"

          if ($response.StatusCode -ne 200) {
              exit 1
          }

      - name: Logout from GHCR
        shell: powershell
        run: |
          docker logout ghcr.io