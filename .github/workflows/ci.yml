name: Laravel CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. TEST
  # ============================================================
  test:
    name: Test

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devops_task_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d devops_task_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        env:
          APP_KEY: ${{ secrets.CI_APP_KEY }}
        run: php artisan key:generate --force

      - name: Generate JWT secret
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: php artisan jwt:secret --force

      - name: Run migrations
        env:
          APP_KEY: ${{ secrets.CI_APP_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: devops_task_test
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force

      - name: Run tests
        env:
          APP_KEY: ${{ secrets.CI_APP_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          JWT_ALGO: HS256
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: devops_task_test
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test

  # ============================================================
  # 2. LINT
  # ============================================================
  lint:
    name: Code Formatting

    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check code formatting
        run: php vendor/bin/pint --test

  # ============================================================
  # 3. COVERAGE
  # ============================================================
  coverage:
    name: Coverage

    needs: test

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: devops_task_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d devops_task_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql
          coverage: xdebug

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate application key
        env:
          APP_KEY: ${{ secrets.CI_APP_KEY }}
        run: php artisan key:generate --force

      - name: Generate JWT secret
        env:
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
        run: php artisan jwt:secret --force

      - name: Run migrations
        env:
          APP_KEY: ${{ secrets.CI_APP_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: devops_task_test
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan migrate --force

      - name: Run tests with coverage
        env:
          APP_KEY: ${{ secrets.CI_APP_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          JWT_ALGO: HS256
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: devops_task_test
          DB_USERNAME: postgres
          DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
        run: php artisan test --coverage

  # ============================================================
  # 4. DOCKER BUILD & PUSH
  # ============================================================
  build-and-push:
    name: Docker Build & Push

    needs:
      - test
      - lint
      - coverage

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/sopheaklaing/devops-task-api:${{ github.sha }}
            ghcr.io/sopheaklaing/devops-task-api:latest

      - name: Tag production image
        if: github.ref == 'refs/heads/main'
        run: |
          docker pull ghcr.io/sopheaklaing/devops-task-api:${{ github.sha }}

          docker tag \
            ghcr.io/sopheaklaing/devops-task-api:${{ github.sha }} \
            ghcr.io/sopheaklaing/devops-task-api:1.0.0

          docker push ghcr.io/sopheaklaing/devops-task-api:1.0.0

  # ============================================================
  # 5. QUALITY GATE
  # ============================================================
  quality-gate:
    name: Quality Gate

    needs:
      - test
      - lint
      - coverage
      - build-and-push

    runs-on: ubuntu-latest

    steps:
      - name: Quality Gate Passed
        run: |
          echo "======================================"
          echo "         QUALITY GATE PASSED"
          echo "======================================"
          echo ""
          echo "TEST       : PASSED"
          echo "LINT       : PASSED"
          echo "COVERAGE   : PASSED"
          echo "DOCKER     : PASSED"
          echo ""
          echo "All CI checks passed successfully!"
          echo "======================================"

  # ============================================================
  # 6. IMAGE INFORMATION
  # ============================================================
  image-info:
    name: Docker Image

    needs: quality-gate

    runs-on: ubuntu-latest

    steps:
      - name: Show Docker Image
        run: |
          echo "======================================"
          echo "           DOCKER IMAGE"
          echo "======================================"
          echo ""
          echo "Image:"
          echo "ghcr.io/sopheaklaing/devops-task-api:${{ github.sha }}"
          echo ""
          echo "Latest:"
          echo "ghcr.io/sopheaklaing/devops-task-api:latest"
          echo ""
          echo "GHCR Package:"
          echo "https://github.com/sopheaklaing/devops-task-api/pkgs/container/devops-task-api"
          echo ""

          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "Production:"
            echo "ghcr.io/sopheaklaing/devops-task-api:1.0.0"
          else
            echo "Production:"
            echo "Not created (main branch only)"
          fi

          echo ""
          echo "======================================"