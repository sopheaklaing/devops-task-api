services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: devops-task-api

    ports:
      - "8000:8000"

    volumes:
      - .:/var/www

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-false}

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    networks:
      - devops-network

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:17

    container_name: devops-postgres

    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - devops-network

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine

    container_name: devops-redis

    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - devops-network

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

networks:
  devops-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data: