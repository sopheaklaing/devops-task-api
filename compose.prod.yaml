services:
  app:
    image: ghcr.io/sopheaklaing/devops-task-api:1.0.0

    container_name: devops-task-api-prod

    ports:
      - "8002:8000"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

    environment:
      APP_ENV: production
      APP_DEBUG: "false"

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: devops_task
      DB_USERNAME: postgres
      DB_PASSWORD: secret

      REDIS_HOST: redis
      REDIS_PORT: 6379

    networks:
      - devops-network

  postgres:
    image: postgres:17

    container_name: devops-postgres-prod

    environment:
      POSTGRES_DB: devops_task
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret

    ports:
      - "5434:5432"

    volumes:
      - postgres-prod-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_task"]
      interval: 5s
      timeout: 5s
      retries: 5

    networks:
      - devops-network

  redis:
    image: redis:7-alpine

    container_name: devops-redis-prod

    ports:
      - "6380:6379"

    volumes:
      - redis-prod-data:/data

    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge

volumes:
  postgres-prod-data:
  redis-prod-data: